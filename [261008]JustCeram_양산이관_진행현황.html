<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JustCeram 양산이관 · 원료 공급 진행 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#F5F6F8;--panel:#FFFFFF;--ink:#17202E;--sub:#5A6475;--line:#DDE1E8;--accent:#3B4FA8;--accent-soft:#E7EAF7;
--s-done:#1F7A55;--s-done-bg:#E3F3EB;--s-prog:#A86400;--s-prog-bg:#FCF0DC;--s-todo:#6B7280;--s-todo-bg:#EEF0F3;--s-block:#B42318;--s-block-bg:#FDE7E5;--s-chk:#3B4FA8;--s-chk-bg:#E7EAF7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151C;--panel:#191F29;--ink:#E6E9EF;--sub:#9AA3B2;--line:#2A3240;--accent:#8E9DE6;--accent-soft:#232B45;
--s-done:#5CC79A;--s-done-bg:#16302A;--s-prog:#F0B35A;--s-prog-bg:#3A2A12;--s-todo:#A3AAB6;--s-todo-bg:#242B36;--s-block:#F2867C;--s-block-bg:#3D1C1A;--s-chk:#9AA8EE;--s-chk-bg:#232B45}}
:root[data-theme="dark"]{--bg:#11151C;--panel:#191F29;--ink:#E6E9EF;--sub:#9AA3B2;--line:#2A3240;--accent:#8E9DE6;--accent-soft:#232B45;
--s-done:#5CC79A;--s-done-bg:#16302A;--s-prog:#F0B35A;--s-prog-bg:#3A2A12;--s-todo:#A3AAB6;--s-todo-bg:#242B36;--s-block:#F2867C;--s-block-bg:#3D1C1A;--s-chk:#9AA8EE;--s-chk-bg:#232B45}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 120px}
header h1{font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--sub);font-size:14px}
.rel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:24px 0}
.rel svg{width:100%;height:auto;display:block}
.rel .n{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.rel .nt{fill:var(--ink);font-size:15px;font-weight:600}
.rel .ns{fill:var(--sub);font-size:12px}
.rel .ea{stroke:var(--accent);stroke-width:1.6;fill:none}
.rel .eb{stroke:var(--s-prog);stroke-width:1.6;fill:none}
.rel .ec{stroke:var(--sub);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.rel .la{fill:var(--accent);font-size:12px;font-weight:500}
.rel .lb{fill:var(--s-prog);font-size:12px;font-weight:500}
.rel .lc{fill:var(--sub);font-size:12px}
.track{margin-top:36px}
.th{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:6px}
.th h2{font-size:19px;font-weight:600;margin:0}
.th .d{color:var(--sub);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--s-todo-bg);margin:10px 0 6px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub);margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1.3fr) 128px minmax(0,1.4fr);gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.dirty{background:var(--accent-soft)}
.id{font-weight:600;font-size:14px;color:var(--accent);padding-top:6px}
.nm{font-weight:500}
.ow{font-size:12px;color:var(--sub);margin-top:2px}
.cr{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.5}
.cr b{font-weight:500;color:var(--ink)}
select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px}
select{width:100%;padding:6px 8px;font-size:13.5px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer}
select[data-s="done"]{color:var(--s-done);background:var(--s-done-bg);border-color:transparent}
select[data-s="prog"]{color:var(--s-prog);background:var(--s-prog-bg);border-color:transparent}
select[data-s="todo"]{color:var(--s-todo);background:var(--s-todo-bg);border-color:transparent}
select[data-s="block"]{color:var(--s-block);background:var(--s-block-bg);border-color:transparent}
select[data-s="chk"]{color:var(--s-chk);background:var(--panel);border:1px dashed var(--s-chk)}
textarea{width:100%;min-height:58px;padding:7px 9px;font-size:13.5px;resize:vertical;line-height:1.5}
.dt{font-size:11.5px;color:var(--sub);margin-top:4px}
select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dec .row{grid-template-columns:52px minmax(0,1.3fr) 128px minmax(0,1.4fr)}
.log{margin-top:36px}
.log h2{font-size:17px;font-weight:600;margin:0 0 10px}
.log ul{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.log li{padding:4px 0 10px 14px;font-size:13.5px}
.log li span{color:var(--sub);font-size:12px;display:block}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;gap:14px;align-items:center}
.save[hidden]{display:none}
.save .msg{font-size:14px;color:var(--sub)}
button{font:inherit;font-weight:500;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.b1{background:var(--accent);color:#fff}
.b2{background:transparent;color:var(--sub);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--sub);margin-top:28px}
@media (max-width:760px){.row,.dec .row{grid-template-columns:44px minmax(0,1fr)}.row>.st,.row>.mm{grid-column:2}header h1{font-size:22px}}

body,.wrap,header,.th,.legend,.row,.row>div,.log,.note,.save{text-align:center}
.th,.legend{justify-content:center}
select{text-align:center;text-align-last:center}
textarea{text-align:center}
.log ul{border-left:0}
.log li{padding:4px 0 10px}

.docs{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.dh{display:flex;justify-content:center;gap:12px;font-size:13px;font-weight:500;margin-bottom:6px}
.dh .dc{color:var(--sub);font-weight:400}
.dg{display:grid;grid-template-columns:minmax(0,1.4fr) 120px minmax(0,1.4fr) 56px;gap:6px 8px;align-items:center}
.dgh{font-size:11.5px;color:var(--sub)}
.dg input{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;text-align:center}
.dg select{font-size:12.5px;padding:5px 6px}
.dx{background:transparent;color:var(--sub);border:1px solid var(--line);padding:4px 8px;font-size:12px}
.dadd{margin-top:8px;background:transparent;color:var(--accent);border:1px dashed var(--accent);padding:5px 14px;font-size:12.5px}
.dsum{font-weight:500;color:var(--ink)}
@media (max-width:760px){.dg{grid-template-columns:1fr 1fr}.dgh{display:none}}
</style>
</head>

function diff(p,i){
  var out=[];
  if(!p)return [i.id+' 추가'];
  if(p.status!==i.status)out.push(i.id+' '+ST[p.status]+' → '+ST[i.status]);
  if(p.memo!==i.memo)out.push(i.id+' 메모 수정');
  var pd={};(p.docs||[]).forEach(function(d){pd[d.id]=d});var seen={};
  (i.docs||[]).forEach(function(d){var o=pd[d.id];seen[d.id]=1;var nm=d.name||'(이름 없음)';
    if(!o){out.push(i.id+' 문서 추가: '+nm+' ('+DS[d.status]+')');return}
    if(o.status!==d.status)out.push(i.id+' '+nm+' '+DS[o.status]+' → '+DS[d.status]);
    if(o.name!==d.name)out.push(i.id+' 문서명 변경: '+(o.name||'(이름 없음)')+' → '+nm);
    else if((o.note||'')!==(d.note||''))out.push(i.id+' '+nm+' 비고 수정')});
  (p.docs||[]).forEach(function(d){if(!seen[d.id])out.push(i.id+' 문서 삭제: '+(d.name||'(이름 없음)'))});
  return out}
document.getElementById('cancel').addEventListener('click',function(){S=JSON.parse(ORIG);dirty={};render()});
document.getElementById('go').addEventListener('click',function(){
  var btn=this;var msg=document.getElementById('msg');
  if(!cap){msg.textContent='이 화면에서는 저장할 수 없습니다. claude.ai에서 열어 주세요.';return}
  var o=JSON.parse(ORIG);var om={};o.tracks.forEach(function(t){t.items.forEach(function(i){om[i.id]=i})});o.decisions.forEach(function(i){om[i.id]=i});
  var parts=[];all().forEach(function(i){if(dirty[i.id])parts=parts.concat(diff(om[i.id],i))});
  if(!parts.length){dirty={};render();return}
  S.meta.updated=today();S.log.push({date:today(),text:parts.join(', ')});if(S.log.length>60)S.log=S.log.slice(-60);
  btn.disabled=true;msg.textContent='저장 중';
  cap.publish(build()).then(function(){msg.textContent='저장됨'}).catch(function(e){btn.disabled=false;S.log.pop();
    var c=e&&e.code;
    if(c==='conflict'){msg.textContent='다른 사람이 먼저 저장했습니다. 새로고침 후 다시 입력해 주세요'}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){readOnly=true;msg.textContent='읽기 전용 화면이라 저장할 수 없습니다';render()}
    else if(c==='rate_limited'){msg.textContent='저장이 잦아 잠시 후 다시 눌러 주세요'}
    else{msg.textContent='저장하지 못했습니다. 잠시 후 다시 시도해 주세요'}})});
render();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){cap=a}).catch(function(){})}
